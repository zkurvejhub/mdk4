name: Build MDK4 for OpenWrt MT7621

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  OPENWRT_VERSION: "25.12.4"
  TARGET: "ramips/mt7621"
  SDK: "openwrt-sdk-25.12.4-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout MDK4
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            zstd \
            file \
            python3

      - name: Download OpenWrt SDK
        working-directory: ${{ runner.temp }}
        run: |
          wget -q --show-progress \
            "https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SDK}.tar.zst"

      - name: Extract OpenWrt SDK
        working-directory: ${{ runner.temp }}
        run: |
          tar --zstd -xf "${SDK}.tar.zst"

      - name: Install OpenWrt feeds
        working-directory: ${{ runner.temp }}/${{ env.SDK }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install libnl-core
          ./scripts/feeds install libnl-genl
          ./scripts/feeds install libpcap

      - name: Patch MDK4 for modern libpcap
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/osdep/file.c")

          if not p.exists():
              raise SystemExit("ERROR: src/osdep/file.c not found")

          s = p.read_text()

          # Modern libpcap exposes DLT_* names.
          # Older MDK4 expects LINKTYPE_* names.

          patch = r'''
          #ifndef TCPDUMP_MAGIC
          #define TCPDUMP_MAGIC 0xa1b2c3d4
          #endif

          #ifndef LINKTYPE_ETHERNET
          #define LINKTYPE_ETHERNET DLT_EN10MB
          #endif

          #ifndef LINKTYPE_IEEE802_11
          #define LINKTYPE_IEEE802_11 DLT_IEEE802_11
          #endif

          #ifndef LINKTYPE_RADIOTAP_HDR
          #define LINKTYPE_RADIOTAP_HDR DLT_IEEE802_11_RADIO
          #endif

          #ifndef LINKTYPE_PRISM_HEADER
          #define LINKTYPE_PRISM_HEADER DLT_PRISM_HEADER
          #endif

          #ifndef LINKTYPE_PPI_HDR
          #define LINKTYPE_PPI_HDR DLT_PPI
          #endif
          '''

          if "LINKTYPE_ETHERNET" not in s:
              raise SystemExit(
                  "ERROR: MDK4 LINKTYPE constants not found in file.c"
              )

          if "#define LINKTYPE_ETHERNET" not in s:
              marker = "#include <pcap.h>"

              if marker not in s:
                  raise SystemExit(
                      "ERROR: #include <pcap.h> not found in file.c"
                  )

              s = s.replace(
                  marker,
                  marker + "\n" + patch,
                  1
              )

              p.write_text(s)

          print("===== Patched file.c =====")
          print(p.read_text())
          print("==========================")

      - name: Create temporary MDK4 OpenWrt package
        env:
          WORKSPACE: ${{ github.workspace }}
          SDK_DIR: ${{ runner.temp }}/${{ env.SDK }}
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          workspace = Path(os.environ["WORKSPACE"])
          sdk = Path(os.environ["SDK_DIR"])

          package = sdk / "package" / "mdk4"
          package.mkdir(parents=True, exist_ok=True)

          makefile = """include $(TOPDIR)/rules.mk

          PKG_NAME:=mdk4
          PKG_VERSION:=4.2
          PKG_RELEASE:=1

          PKG_BUILD_DIR:=$(BUILD_DIR)/$(PKG_NAME)-$(PKG_VERSION)

          PKG_LICENSE:=GPL-3.0-or-later
          PKG_LICENSE_FILES:=COPYING

          include $(INCLUDE_DIR)/package.mk

          define Package/mdk4
            SECTION:=net
            CATEGORY:=Network
            SUBMENU:=Wireless
            TITLE:=MDK4 WiFi testing tool
            URL:=https://github.com/aircrack-ng/mdk4
            DEPENDS:=+libnl-core +libnl-genl +libpcap
          endef

          define Package/mdk4/description
           MDK4 is a WiFi testing tool from the Aircrack-ng project.
          endef

          define Build/Prepare
          \tmkdir -p $(PKG_BUILD_DIR)
          \tcp -a $(CURDIR)/src/. $(PKG_BUILD_DIR)/
          endef

          define Build/Compile
          \t$(MAKE) -C $(PKG_BUILD_DIR) \\
          \t\tCC="$(TARGET_CC)" \\
          \t\tAR="$(TARGET_AR)" \\
          \t\tRANLIB="$(TARGET_RANLIB)" \\
          \t\tSTRIP="$(TARGET_STRIP)" \\
          \t\tCFLAGS="$(TARGET_CFLAGS)" \\
          \t\tLDFLAGS="$(TARGET_LDFLAGS)"
          endef

          define Package/mdk4/install
          \t$(INSTALL_DIR) $(1)/usr/sbin
          \t$(INSTALL_BIN) $(PKG_BUILD_DIR)/mdk4 $(1)/usr/sbin/mdk4
          endef

          $(eval $(call BuildPackage,mdk4))
          """

          lines = makefile.splitlines()
          cleaned = []

          for line in lines:
              if line.startswith("          "):
                  line = line[10:]
              cleaned.append(line)

          (package / "Makefile").write_text(
              "\n".join(cleaned) + "\n",
              encoding="utf-8"
          )

          source = package / "src"
          source.mkdir(parents=True, exist_ok=True)

          for item in workspace.iterdir():

              if item.name in {
                  ".git",
                  ".github",
                  "package"
              }:
                  continue

              destination = source / item.name

              if item.is_dir():
                  shutil.copytree(
                      item,
                      destination,
                      dirs_exist_ok=True
                  )
              else:
                  shutil.copy2(
                      item,
                      destination
                  )

          print("Temporary OpenWrt package created:")
          print(package)

      - name: Verify OpenWrt Makefile
        working-directory: ${{ runner.temp }}/${{ env.SDK }}
        run: |
          echo "===== OpenWrt Makefile ====="
          cat -n package/mdk4/Makefile
          echo "============================"

      - name: Configure OpenWrt SDK
        working-directory: ${{ runner.temp }}/${{ env.SDK }}
        run: |
          make defconfig

      - name: Build MDK4
        working-directory: ${{ runner.temp }}/${{ env.SDK }}
        run: |
          make package/mdk4/compile V=s -j2

      - name: Find generated IPK
        working-directory: ${{ runner.temp }}/${{ env.SDK }}
        run: |
          echo "===== Generated packages ====="

          find bin/packages \
            -type f \
            -name 'mdk4*.ipk' \
            -print

          echo "=============================="

      - name: Verify package
        working-directory: ${{ runner.temp }}/${{ env.SDK }}
        run: |
          IPK=$(find bin/packages \
            -type f \
            -name 'mdk4*.ipk' \
            | head -n1)

          if [ -z "$IPK" ]; then
            echo "ERROR: No MDK4 IPK was generated"
            exit 1
          fi

          echo "Generated package:"
          echo "$IPK"

          echo
          echo "Package architecture:"
          file "$IPK"

      - name: Upload MDK4 IPK
        uses: actions/upload-artifact@v4
        with:
          name: mdk4-openwrt-mt7621
          path: ${{ runner.temp }}/${{ env.SDK }}/bin/packages/**/*.ipk
          if-no-files-found: error
          retention-days: 30
