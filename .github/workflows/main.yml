name: Build MDK4 for OpenWrt MT7621

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  OPENWRT_VERSION: "25.12.4"
  TARGET: "ramips/mt7621"
  SDK: "openwrt-sdk-25.12.4-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout MDK4
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            zstd \
            file \
            python3 \
            pkg-config

      - name: Download OpenWrt SDK
        working-directory: ${{ runner.temp }}
        run: |
          wget -q --show-progress \
            "https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SDK}.tar.zst"

      - name: Extract OpenWrt SDK
        working-directory: ${{ runner.temp }}
        run: |
          tar --zstd -xf "${SDK}.tar.zst"

      - name: Install OpenWrt feeds
        working-directory: ${{ runner.temp }}/${{ env.SDK }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install libnl-core
          ./scripts/feeds install libnl-genl
          ./scripts/feeds install libpcap

      - name: Patch MDK4 for OpenWrt musl and libnl3
        working-directory: ${{ github.workspace }}
        run: |
          python3 <<'PY'
          from pathlib import Path

          # ---------------------------------------------------------
          # byteorder.h
          # Use endian definitions supplied by OpenWrt/musl.
          # ---------------------------------------------------------
          p = Path("src/osdep/byteorder.h")
          if not p.exists():
              raise SystemExit("ERROR: src/osdep/byteorder.h not found")

          byteorder = r'''
          #ifndef MDK4_BYTEORDER_H
          #define MDK4_BYTEORDER_H

          #include <stdint.h>
          #include <sys/types.h>
          #include <endian.h>

          #ifndef u_int8_t
          typedef uint8_t u_int8_t;
          #endif

          #ifndef u_int16_t
          typedef uint16_t u_int16_t;
          #endif

          #ifndef u_int32_t
          typedef uint32_t u_int32_t;
          #endif

          #ifndef u_int64_t
          typedef uint64_t u_int64_t;
          #endif

          #ifndef cpu_to_le16
          #define cpu_to_le16(x) htole16(x)
          #endif

          #ifndef le16_to_cpu
          #define le16_to_cpu(x) letoh16(x)
          #endif

          #ifndef cpu_to_le32
          #define cpu_to_le32(x) htole32(x)
          #endif

          #ifndef le32_to_cpu
          #define le32_to_cpu(x) letoh32(x)
          #endif

          #ifndef cpu_to_le64
          #define cpu_to_le64(x) htole64(x)
          #endif

          #ifndef le64_to_cpu
          #define le64_to_cpu(x) letoh64(x)
          #endif

          #ifndef cpu_to_be16
          #define cpu_to_be16(x) htobe16(x)
          #endif

          #ifndef be16_to_cpu
          #define be16_to_cpu(x) betoh16(x)
          #endif

          #ifndef cpu_to_be32
          #define cpu_to_be32(x) htobe32(x)
          #endif

          #ifndef be32_to_cpu
          #define be32_to_cpu(x) betoh32(x)
          #endif

          #ifndef cpu_to_be64
          #define cpu_to_be64(x) htobe64(x)
          #endif

          #ifndef be64_to_cpu
          #define be64_to_cpu(x) betoh64(x)
          #endif

          #ifndef __be32_to_cpu
          #define __be32_to_cpu(x) be32_to_cpu(x)
          #endif

          #ifndef __be64_to_cpu
          #define __be64_to_cpu(x) be64_to_cpu(x)
          #endif

          #endif
          '''

          p.write_text(byteorder.strip() + "\n", encoding="utf-8")

          # ---------------------------------------------------------
          # file.c compatibility with modern libpcap
          # ---------------------------------------------------------
          p = Path("src/osdep/file.c")
          if not p.exists():
              raise SystemExit("ERROR: src/osdep/file.c not found")

          s = p.read_text(encoding="utf-8")

          patch = r'''
          #ifndef TCPDUMP_MAGIC
          #define TCPDUMP_MAGIC 0xa1b2c3d4
          #endif

          #ifndef LINKTYPE_ETHERNET
          #define LINKTYPE_ETHERNET DLT_EN10MB
          #endif

          #ifndef LINKTYPE_IEEE802_11
          #define LINKTYPE_IEEE802_11 DLT_IEEE802_11
          #endif

          #ifndef LINKTYPE_RADIOTAP_HDR
          #define LINKTYPE_RADIOTAP_HDR DLT_IEEE802_11_RADIO
          #endif

          #ifndef LINKTYPE_PRISM_HEADER
          #define LINKTYPE_PRISM_HEADER DLT_PRISM_HEADER
          #endif

          #ifndef LINKTYPE_PPI_HDR
          #define LINKTYPE_PPI_HDR DLT_PPI
          #endif
          '''

          if "#define LINKTYPE_ETHERNET" not in s:
              s = patch.strip() + "\n\n" + s

          p.write_text(s, encoding="utf-8")

          # ---------------------------------------------------------
          # osdep.c needs unistd.h for usleep()
          # ---------------------------------------------------------
          p = Path("src/osdep.c")
          if not p.exists():
              raise SystemExit("ERROR: src/osdep.c not found")

          s = p.read_text(encoding="utf-8")

          if "#include <unistd.h>" not in s:
              s = "#include <unistd.h>\n" + s

          p.write_text(s, encoding="utf-8")

          # ---------------------------------------------------------
          # network.c compatibility
          #
          # Fix MDK4 typo:
          #
          #   << 32 || buf[1]
          #
          # must be:
          #
          #   << 32 | buf[1]
          # ---------------------------------------------------------
          p = Path("src/osdep/network.c")
          if not p.exists():
              raise SystemExit("ERROR: src/osdep/network.c not found")

          s = p.read_text(encoding="utf-8")

          s = s.replace(
              "((uint64_t)buf[0] << 32 || buf[1])",
              "((uint64_t)buf[0] << 32 | buf[1])"
          )

          p.write_text(s, encoding="utf-8")

          # ---------------------------------------------------------
          # channelhopper.c
          #
          # Force the modern libnl3 API.
          # ---------------------------------------------------------
          p = Path("src/channelhopper.c")
          if not p.exists():
              raise SystemExit("ERROR: src/channelhopper.c not found")

          s = p.read_text(encoding="utf-8")

          # Force libnl3 API selection.
          if "#define CONFIG_LIBNL30 1" not in s:
              s = (
                  "#ifndef CONFIG_LIBNL30\n"
                  "#define CONFIG_LIBNL30 1\n"
                  "#endif\n\n"
                  + s
              )

          # ---------------------------------------------------------
          # pthread_t is not an int on musl/MIPS.
          #
          # Old:
          #   pthread_t chan_sniffer = (int)NULL;
          #
          # Correct:
          #   pthread_t chan_sniffer = 0;
          # ---------------------------------------------------------
          s = s.replace(
              "pthread_t chan_sniffer = (int)NULL;",
              "pthread_t chan_sniffer = 0;"
          )

          p.write_text(s, encoding="utf-8")

          print("MDK4 OpenWrt/musl/libnl3/pthread compatibility patches applied.")
          PY

      - name: Create temporary OpenWrt package
        env:
          WORKSPACE: ${{ github.workspace }}
          SDK_DIR: ${{ runner.temp }}/${{ env.SDK }}
        run: |
          python3 <<'PY'
          import os
          import shutil
          from pathlib import Path

          workspace = Path(os.environ["WORKSPACE"])
          sdk = Path(os.environ["SDK_DIR"])
          package = sdk / "package" / "mdk4"

          package.mkdir(parents=True, exist_ok=True)

          makefile = r'''
          include $(TOPDIR)/rules.mk

          PKG_NAME:=mdk4
          PKG_VERSION:=4.2
          PKG_RELEASE:=4

          PKG_BUILD_DIR:=$(BUILD_DIR)/$(PKG_NAME)-$(PKG_VERSION)

          PKG_LICENSE:=GPL-3.0-or-later
          PKG_LICENSE_FILES:=COPYING

          include $(INCLUDE_DIR)/package.mk

          define Package/mdk4
            SECTION:=net
            CATEGORY:=Network
            SUBMENU:=Wireless
            TITLE:=MDK4 WiFi testing tool
            URL:=https://github.com/aircrack-ng/mdk4
            DEPENDS:=+libnl-core +libnl-genl +libpcap
          endef

          define Package/mdk4/description
            MDK4 is a WiFi testing tool from the Aircrack-ng project.
          endef

          define Build/Prepare
          	mkdir -p $(PKG_BUILD_DIR)
          	cp -a $(CURDIR)/src/. $(PKG_BUILD_DIR)/
          endef

          define Build/Configure
          endef

          define Build/Compile
          	$(MAKE) -C $(PKG_BUILD_DIR) \
          		CC="$(TARGET_CC)" \
          		AR="$(TARGET_AR)" \
          		RANLIB="$(TARGET_RANLIB)" \
          		STRIP="$(TARGET_STRIP)" \
          		CFLAGS="$(TARGET_CFLAGS) -mno-mips16 -DCONFIG_LIBNL30=1 -I$(STAGING_DIR)/usr/include/libnl3" \
          		CPPFLAGS="$(TARGET_CPPFLAGS) -DCONFIG_LIBNL30=1 -I$(STAGING_DIR)/usr/include/libnl3" \
          		LDFLAGS="$(TARGET_LDFLAGS) -L$(STAGING_DIR)/usr/lib -lnl-genl-3 -lnl-3"
          endef

          define Package/mdk4/install
          	$(INSTALL_DIR) $(1)/usr/sbin
          	$(INSTALL_BIN) $(PKG_BUILD_DIR)/src/mdk4 $(1)/usr/sbin/mdk4
          endef

          $(eval $(call BuildPackage,mdk4))
          '''

          (package / "Makefile").write_text(
              makefile.strip() + "\n",
              encoding="utf-8"
          )

          source = package / "src"
          source.mkdir(parents=True, exist_ok=True)

          excluded = {
              ".git",
              ".github",
              "package"
          }

          for item in workspace.iterdir():
              if item.name in excluded:
                  continue

              destination = source / item.name

              if item.is_dir():
                  shutil.copytree(
                      item,
                      destination,
                      dirs_exist_ok=True
                  )
              else:
                  shutil.copy2(item, destination)

          print("Temporary OpenWrt package created.")

      - name: Verify libnl and patched sources
        working-directory: ${{ runner.temp }}/${{ env.SDK }}
        run: |
          echo "===== libnl headers ====="
          find staging_dir \
            -path '*include/libnl3/netlink/genl/genl.h' \
            -print

          echo
          echo "===== libnl libraries ====="
          find staging_dir \
            -type f \
            \( -name 'libnl-3.so*' -o -name 'libnl-genl-3.so*' \) \
            -print

          echo
          echo "===== byteorder.h ====="
          sed -n '1,180p' \
            package/mdk4/src/src/osdep/byteorder.h

          echo
          echo "===== file.c ====="
          sed -n '1,120p' \
            package/mdk4/src/src/osdep/file.c

          echo
          echo "===== osdep.c ====="
          sed -n '1,50p' \
            package/mdk4/src/src/osdep.c

          echo
          echo "===== network.c relevant lines ====="
          grep -n -C 3 \
            -E '__be64_to_cpu|__be32_to_cpu|ri_mactime|ri_power' \
            package/mdk4/src/src/osdep/network.c || true

          echo
          echo "===== channelhopper.c compatibility ====="
          grep -n -C 5 \
            -E 'CONFIG_LIBNL30|chan_sniffer|nl_socket_alloc|nl_handle_alloc|nl_socket_free|nl_handle_destroy' \
            package/mdk4/src/src/channelhopper.c || true

          echo
          echo "===== OpenWrt Makefile ====="
          cat -n package/mdk4/Makefile

      - name: Configure OpenWrt SDK
        working-directory: ${{ runner.temp }}/${{ env.SDK }}
        run: |
          make defconfig

      - name: Build MDK4
        working-directory: ${{ runner.temp }}/${{ env.SDK }}
        run: |
          set -o pipefail

          make package/mdk4/compile V=s -j1 2>&1 | tee mdk4-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo
          echo "========================================"
          echo "MDK4 compiler errors"
          echo "========================================"

          grep -n -E \
            'error:|fatal error:|undefined reference|No such file|not found' \
            mdk4-build.log || true

          echo
          echo "========================================"
          echo "Last 150 lines"
          echo "========================================"

          tail -150 mdk4-build.log

          exit $BUILD_STATUS

      - name: Find generated APK
        working-directory: ${{ runner.temp }}/${{ env.SDK }}
        run: |
          echo "===== Generated packages ====="

          find bin/packages \
            -type f \
            -name "mdk4*.apk" \
            -print

      - name: Verify package
        working-directory: ${{ runner.temp }}/${{ env.SDK }}
        run: |
          APK=$(find bin/packages \
            -type f \
            -name "mdk4*.apk" \
            | head -n1)

          if [ -z "$APK" ]; then
            echo "ERROR: No MDK4 APK was generated"
            echo
            echo "Available packages:"
            find bin/packages -type f -print || true
            exit 1
          fi

          echo "Generated package:"
          echo "$APK"

          echo
          echo "Package information:"
          file "$APK"

      - name: Upload MDK4 APK
        uses: actions/upload-artifact@v4
        with:
          name: mdk4-openwrt-mt7621
          path: ${{ runner.temp }}/${{ env.SDK }}/bin/packages/**/*.apk
          if-no-files-found: error
          retention-days: 30
